plugins {
    id 'com.android.application'
    // google-services.json(공개 설정, 비밀 키 아님)으로 Firebase 앱 ID를 넣는다. FCM 알림 토큰에만 쓴다.
    id 'com.google.gms.google-services'
}

def defaultKeystore = file("${rootDir}/signing/voicecap-upload.jks")
def releaseStoreFile = providers.environmentVariable('VOICECAP_UPLOAD_KEYSTORE').orNull ?: (defaultKeystore.exists() ? defaultKeystore.absolutePath : null)
def releaseStorePassword = providers.environmentVariable('VOICECAP_UPLOAD_STORE_PASSWORD').orNull ?: (defaultKeystore.exists() ? 'VoiceCAP!2026UploadKey#982' : null)
def releaseKeyAlias = providers.environmentVariable('VOICECAP_UPLOAD_KEY_ALIAS').orNull ?: (defaultKeystore.exists() ? 'voicecap-upload' : null)
def releaseKeyPassword = providers.environmentVariable('VOICECAP_UPLOAD_KEY_PASSWORD').orNull ?: (defaultKeystore.exists() ? 'VoiceCAP!2026UploadKey#982' : null)
def hasReleaseSigning = releaseStoreFile && releaseStorePassword && releaseKeyAlias && releaseKeyPassword && file(releaseStoreFile).exists()

android {
    namespace 'com.voicecap.sms'
    compileSdk 36

    defaultConfig {
        applicationId 'shop.voicecap.smsbridge'
        minSdk 26
        targetSdk 36
        versionCode 13
        versionName '1.6.2'
        def apiBaseUrl = (project.findProperty('VOICECAP_API_BASE_URL') ?: 'https://ymegrhxpbeanvxwdzfym.supabase.co/functions/v1').toString().replaceAll('/+$', '')
        buildConfigField 'String', 'VOICECAP_API_BASE_URL', '"' + apiBaseUrl.replace('"', '\\"') + '"'
        // 판매관리 탭. false인 동안 탭은 회색으로 보이고, 판매 코드(저장소·화면·작업)는 하나도 시작하지 않는다.
        buildConfigField 'boolean', 'SALES_TAB_ENABLED', 'false'
    }

    buildFeatures { buildConfig true }

    signingConfigs {
        release {
            if (hasReleaseSigning) {
                storeFile file(releaseStoreFile)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
                enableV1Signing true
                enableV2Signing true
                enableV3Signing true
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (hasReleaseSigning) signingConfig signingConfigs.release
        }
    }
}

// 빌드 완료 시 항상 android/voicecapSMS/release-output 에 복사
tasks.register('copyOutputsToRoot') {
    doLast {
        def targetDir = file("${rootDir}/release-output")
        if (!targetDir.exists()) {
            targetDir.mkdirs()
        }

        def vName = android.defaultConfig.versionName

        // 1. Debug APK 복사
        def debugApk = file("${buildDir}/outputs/apk/debug/app-debug.apk")
        if (debugApk.exists()) {
            copy {
                from debugApk
                into targetDir
                rename { "voicecap-sms-${vName}-debug.apk" }
            }
            println "[VoiceCAP] Debug APK 복사 완료 -> ${targetDir.absolutePath}/voicecap-sms-${vName}-debug.apk"
        }

        // 2. Release APK (휴대폰 직접 설치용 서명 완료본) 복사
        def releaseApk = file("${buildDir}/outputs/apk/release/app-release.apk")
        if (releaseApk.exists()) {
            copy {
                from releaseApk
                into targetDir
                rename { "voicecap-sms-${vName}-release.apk" }
            }
            println "[VoiceCAP] Release APK 복사 완료 -> ${targetDir.absolutePath}/voicecap-sms-${vName}-release.apk"
        }

        // 3. Play Store 업로드용 Release AAB (Android App Bundle) 복사
        def releaseAab = file("${buildDir}/outputs/bundle/release/app-release.aab")
        if (releaseAab.exists()) {
            copy {
                from releaseAab
                into targetDir
                rename { "voicecap-sms-${vName}-release.aab" }
            }
            println "[VoiceCAP] Play Store용 Release AAB 복사 완료 -> ${targetDir.absolutePath}/voicecap-sms-${vName}-release.aab"
        }
    }
}


gradle.projectsEvaluated {
    tasks.matching {
        it.name in ['assembleDebug', 'assembleRelease', 'bundleRelease', 'assemble', 'bundle']
    }.configureEach {
        finalizedBy 'copyOutputsToRoot'
    }
}

dependencies {
    // 유일한 런타임 의존성 예외: 웹 즉시 발송용 FCM (설계 3.2·3.7).
    implementation platform('com.google.firebase:firebase-bom:34.4.0')
    implementation 'com.google.firebase:firebase-messaging'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
}
