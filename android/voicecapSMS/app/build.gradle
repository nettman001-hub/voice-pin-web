plugins {
    id 'com.android.application'
    // google-services.json(공개 설정, 비밀 키 아님)으로 Firebase 앱 ID를 넣는다. FCM 알림 토큰에만 쓴다.
    id 'com.google.gms.google-services'
}

def signingPropsFile = rootProject.file('signing/signing.properties')
def signingProps = new Properties()
if (signingPropsFile.exists()) {
    signingPropsFile.withInputStream { signingProps.load(it) }
}

def releaseStoreFile = providers.environmentVariable('VOICECAP_UPLOAD_KEYSTORE').orNull ?: signingProps.getProperty('storeFile')
def releaseStorePassword = providers.environmentVariable('VOICECAP_UPLOAD_STORE_PASSWORD').orNull ?: signingProps.getProperty('storePassword')
def releaseKeyAlias = providers.environmentVariable('VOICECAP_UPLOAD_KEY_ALIAS').orNull ?: signingProps.getProperty('keyAlias')
def releaseKeyPassword = providers.environmentVariable('VOICECAP_UPLOAD_KEY_PASSWORD').orNull ?: signingProps.getProperty('keyPassword')

def resolvedStoreFile = null
if (releaseStoreFile) {
    resolvedStoreFile = file(releaseStoreFile)
    if (!resolvedStoreFile.isAbsolute() && signingPropsFile.exists()) {
        resolvedStoreFile = new File(signingPropsFile.parentFile, releaseStoreFile)
    }
}

def hasReleaseSigning = resolvedStoreFile && resolvedStoreFile.exists() && releaseStorePassword && releaseKeyAlias && releaseKeyPassword
def hasPartialReleaseSigning = [releaseStoreFile, releaseStorePassword, releaseKeyAlias, releaseKeyPassword].any { it } && !hasReleaseSigning

if (hasPartialReleaseSigning) {
    throw new GradleException('VOICECAP_UPLOAD_* 서명 환경 변수 또는 signing.properties 설정 4개를 모두 유효하게 설정해야 합니다.')
}

android {
    namespace 'com.voicecap.sms'
    compileSdk 36

    defaultConfig {
        applicationId 'shop.voicecap.smsbridge'
        minSdk 26
        targetSdk 36
        versionCode 13
        versionName '1.6.2'
        def apiBaseUrl = (project.findProperty('VOICECAP_API_BASE_URL') ?: 'https://ymegrhxpbeanvxwdzfym.supabase.co/functions/v1').toString().replaceAll('/+$', '')
        buildConfigField 'String', 'VOICECAP_API_BASE_URL', '"' + apiBaseUrl.replace('"', '\\"') + '"'
        // 판매관리 탭. false인 동안 탭은 회색으로 보이고, 판매 코드(저장소·화면·작업)는 하나도 시작하지 않는다.
        buildConfigField 'boolean', 'SALES_TAB_ENABLED', 'false'
    }

    buildFeatures { buildConfig true }

    signingConfigs {
        release {
            if (hasReleaseSigning) {
                storeFile resolvedStoreFile
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
                enableV1Signing true
                enableV2Signing true
                enableV3Signing true
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (hasReleaseSigning) signingConfig signingConfigs.release
        }
    }
}

dependencies {
    // 유일한 런타임 의존성 예외: 웹 즉시 발송용 FCM (설계 3.2·3.7).
    implementation platform('com.google.firebase:firebase-bom:34.4.0')
    implementation 'com.google.firebase:firebase-messaging'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
}
